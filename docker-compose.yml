services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: resume-builder-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassw0rd123"
    ports:
      - "14330:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: resume-builder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mssql-data:
  redis-data:
